<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de Código de Verificación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2d3142;
        }
        
        .verification-container {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .verification-title {
            font-size: 24px;
            font-weight: 600;
            color: #2d3142;
            margin-bottom: 12px;
        }
        
        .verification-description {
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .form-group {
            margin-bottom: 30px;
            text-align: left;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #2d3142;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            transition: border-color 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #4568dc;
        }
        
        .form-control::placeholder {
            color: #999;
        }
        
        .button-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }
        
        .btn-cancel {
            background-color: #ffffff;
            color: #333;
            border: 1px solid #e0e0e0;
        }
        
        .btn-cancel:hover {
            background-color: #f5f5f5;
        }
        
        @media (max-width: 576px) {
            .verification-container {
                padding: 30px 20px;
                margin: 0 15px;
            }
            
            .button-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <h1 class="verification-title">Recupera tu contraseña</h1>
        <p class="verification-description">Te enviaremos un código a tu correo para que puedas recuperar tu cuenta</p>
        
        <form id="verificationForm">
            <div class="form-group">
                <label for="code" class="form-label">Código</label>
                <input type="text" id="code" class="form-control" placeholder="Ingresa el código enviado" required>
            </div>
            
            <div class="button-container">
                <button type="button" class="btn btn-cancel">Cancelar</button>
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('verificationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const code = document.getElementById('code').value;
            
            if (!code) {
                alert('Por favor ingresa el código de verificación');
                return;
            }
            
            // Verification logic would go here
            alert('Código verificado correctamente');
        });
    </script>
</body>
</html>
