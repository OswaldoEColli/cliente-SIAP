<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAP - Sistema de Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Sidebar Styles */
        .sidebar {
            width: 200px;
            background-color: #2d3142;
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            position: relative;
        }
        
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        
        .logo {
            font-weight: bold;
            font-size: 18px;
        }
        
        .theme-toggle {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }
        
        .sidebar-toggle {
            display: none;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            margin-left: 16px;
            cursor: pointer;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: #e0e0e0;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        
        .menu-item.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border-left: 3px solid #b0b0b0;
            font-weight: 500;
        }
        
        .menu-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .menu-item i {
            margin-right: 12px;
            font-size: 18px;
            width: 20px;
            text-align: center;
        }
        
        .logout-btn {
            margin-top: auto;
            margin-left: 16px;
            margin-right: 16px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            transition: background-color 0.3s;
        }
        
        .logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .logout-btn i {
            margin-right: 8px;
        }
        
        /* Main Content Styles */
        .main-content {
            flex-grow: 1;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
        }
        
        .content-header {
            padding: 20px 30px;
            border-bottom: 1px solid #e0e0e0;
            background-color: #f5f5f5;
        }
        
        .content-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #333;
        }
        
        .content-area {
            padding: 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .sales-container {
            background-color: white;
            margin: 0;
            border-radius: 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .register-btn {
            background-color: #2e3b7c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 150px;
            height: 100px;
        }
        
        .register-btn:hover {
            background-color: #232e61;
        }
        
        .register-btn i {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        /* Responsive Styles */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -200px;
                top: 0;
                height: 100%;
                z-index: 100;
                transition: left 0.3s ease;
            }
            
            .sidebar.active {
                left: 0;
            }
            
            .sidebar-toggle {
                display: block;
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 101;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .content-header {
                padding-left: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar Toggle Button (Mobile) -->
    <button class="sidebar-toggle" id="sidebar-toggle">
        <i class="fas fa-bars"></i>
    </button>
    
    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">SIAP •</div>
            <button class="theme-toggle">
                <i class="fas fa-sun"></i>
            </button>
        </div>
        
        <a href="#" class="menu-item active">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </a>
        
        <a href="#" class="menu-item">
            <i class="fas fa-dollar-sign"></i>
            <span>Ventas</span>
        </a>
        
        <a href="#" class="menu-item">
            <i class="fas fa-users"></i>
            <span>Clientes</span>
        </a>
        
        <a href="#" class="menu-item">
            <i class="fas fa-chart-bar"></i>
            <span>Reportes</span>
        </a>
        
        <a href="#" class="menu-item">
            <i class="fas fa-book"></i>
            <span>Catálogo</span>
        </a>
        
        <a href="#" class="menu-item">
            <i class="fas fa-boxes"></i>
            <span>Inventario</span>
        </a>
        
        <a href="#" class="menu-item">
            <i class="fas fa-cog"></i>
            <span>Ajustes</span>
        </a>
        
        <button class="logout-btn">
            <i class="fas fa-sign-out-alt"></i>
            <span>Salir</span>
        </button>
    </div>
    
    <!-- Main Content Area -->
    <div class="main-content">
        <div class="content-header">
            <h1>¡Hola! Aquí podrás realizar tus ventas.</h1>
        </div>
        
        <div class="content-area">
            <div class="sales-container">
                <button class="register-btn" id="open-register">
                    <i class="fas fa-cash-register"></i>
                    <span>Abrir caja registradora</span>
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Toggle sidebar on mobile
        document.getElementById('sidebar-toggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
        });
        
        // Theme toggle functionality
        const themeToggle = document.querySelector('.theme-toggle');
        const body = document.body;
        
        themeToggle.addEventListener('click', function() {
            body.classList.toggle('light-mode');
            if (body.classList.contains('light-mode')) {
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            } else {
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
        });
        
        // Open register button functionality
        document.getElementById('open-register').addEventListener('click', function() {
            alert('Abriendo caja registradora...');
            // Here you would typically redirect to a POS interface or open a modal
        });
        
        // Menu item click handler
        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
            item.addEventListener('click', function(e) {
                // Remove active class from all menu items
                menuItems.forEach(i => i.classList.remove('active'));
                // Add active class to clicked item
                this.classList.add('active');
                
                // On mobile, close the sidebar after selection
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('active');
                }
            });
        });
        
        // Logout button functionality
        document.querySelector('.logout-btn').addEventListener('click', function() {
            if (confirm('¿Seguro que deseas cerrar sesión?')) {
                // Logout logic would go here
                alert('Sesión cerrada');
                // window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
