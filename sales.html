<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAP - Sistema de Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Work+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/salesStyle.css">
</head>
<body>
    <!-- ELIMINADO: Botón toggle del sidebar -->

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <!-- MODIFICADO: Simplificado el header del sidebar -->
            
        </div>

        <a href="home.html" class="menu-item">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </a>

        <a href="#" class="menu-item active">
            <i class="fas fa-dollar-sign"></i>
            <span>Ventas</span>
        </a>

        <a href="customer.html" class="menu-item">
            <i class="fas fa-users"></i>
            <span>Clientes</span>
        </a>

        <a href="reports.html" class="menu-item">
            <i class="fas fa-chart-bar"></i>
            <span>Reportes</span>
        </a>

        <a href="inventory.html" class="menu-item">
            <i class="fas fa-boxes"></i>
            <span>Inventario</span>
        </a>

        <a href="branches.html" class="menu-item">
            <i class="fas fa-map-marker-alt"></i>
            <span>Sucursales</span>
        </a>

        <a href="settings.html" class="menu-item">
            <i class="fas fa-cog"></i>
            <span>Ajustes</span>
        </a>

        <button class="logout-btn">
            <i class="fas fa-sign-out-alt"></i>
            <span>Salir</span>
        </button>
    </div>

    <!-- NUEVO: Logo flotante que se mueve con el sidebar -->
    <div class="floating-logo" id="floating-logo">
        <div class="logo">SIAP </div>
        <img src="photos/logo 3.png" alt="Logo SIAP" class="logo-img">
    </div>

    <div class="main-content">
        <div class="content-header">
            <h1>¡Hola! Aquí podrás realizar tus ventas.</h1>
        </div>

        <div class="content-area">
            <div class="sales-container">
                <button class="register-btn" id="open-register">
                    <i class="fas fa-cash-register"></i>
                    <span>Abrir caja registradora</span>
                </button>
            </div>
        </div>
    </div>

    <div id="register-modal">
        <div class="modal-content">
            <h2>Abrir caja registradora</h2>
            <label for="initial-amount">Monto inicial:</label>
            <input type="number" id="initial-amount" placeholder="Ej. 100.00">

            <label for="register-note">Nota (opcional):</label>
            <textarea id="register-note" rows="3" placeholder="Ej. Inicio de turno matutino..."></textarea>

            <div class="modal-footer">
                <button id="cancel-modal">Cancelar</button>
                <button id="confirm-open">Abrir</button>
            </div>
        </div>
    </div>

    <script>
        // NUEVO: Elementos principales
        const floatingLogo = document.getElementById('floating-logo');
        const sidebar = document.getElementById('sidebar');
        
        // NUEVO: Toggle sidebar con el logo flotante
        if (floatingLogo) {
            floatingLogo.addEventListener('click', function() {
                sidebar.classList.toggle('active');
            });
        }

        // CONSERVADO: Código para el toggle de tema
        const themeToggle = document.querySelector('.theme-toggle');
        const body = document.body;

        if (themeToggle) {
            themeToggle.addEventListener('click', function(e) {
                // Evita que el clic en el botón de tema active el sidebar
                e.stopPropagation();
                
                body.classList.toggle('light-mode');
                themeToggle.innerHTML = body.classList.contains('light-mode')
                    ? '<i class="fas fa-moon"></i>'
                    : '<i class="fas fa-sun"></i>';
            });
        }

        // CONSERVADO: Código para el modal
        document.getElementById('open-register').addEventListener('click', function () {
            document.getElementById('register-modal').style.display = 'flex';
        });

        document.getElementById('cancel-modal').addEventListener('click', function () {
            document.getElementById('register-modal').style.display = 'none';
        });

        document.getElementById('confirm-open').addEventListener('click', function () {
            const amount = document.getElementById('initial-amount').value.trim();
            const note = document.getElementById('register-note').value.trim();

            if (!amount || isNaN(amount) || Number(amount) <= 0) {
                alert('Por favor ingresa un monto válido.');
                return;
            }

            localStorage.setItem('registerAmount', amount);
            localStorage.setItem('registerNote', note);

            window.location.href = 'productsSale.html';
        });

        // CONSERVADO: Manejo de menú activo
        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
            item.addEventListener('click', function () {
                menuItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('active');
                }
            });
        });

        // CONSERVADO: Botón de logout
        document.querySelector('.logout-btn').addEventListener('click', function () {
            if (confirm('¿Seguro que deseas cerrar sesión?')) {
                alert('Sesión cerrada');
                window.location.href = 'login.html';
            }
        });
        
        // NUEVO: Inicializar para dispositivos móviles
        if (window.innerWidth <= 768) {
            // En móviles, sidebar comienza oculto (ya configurado en CSS)
            // No es necesario añadir la clase 'active' aquí
        }
    </script>
</body>
</html>
