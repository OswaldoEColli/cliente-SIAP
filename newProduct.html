<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Punto de Venta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            height: 100vh;
            background-color: #2a2a36;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .main-container {
            width: 100%;
            max-width: 1200px;
            background-color: #e9e9e9;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        
        .navigation {
            display: flex;
            gap: 20px;
        }
        
        .nav-item {
            font-weight: 500;
            cursor: pointer;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .logo img {
            height: 30px;
        }
        
        .search-bar {
            position: relative;
        }
        
        .search-bar input {
            padding: 8px 12px 8px 35px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 200px;
        }
        
        .search-bar i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }
        
        .content-area {
            display: flex;
            height: calc(100vh - 120px);
        }
        
        .cart-area {
            flex: 4;
            background-color: #fff;
            margin: 15px;
            border-radius: 5px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .empty-cart {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }
        
        .empty-cart i {
            font-size: 50px;
            margin-bottom: 15px;
            color: #444;
        }
        
        .add-button {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background-color: white;
            border-radius: 5px;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        
        .bottom-buttons {
            padding: 15px;
            display: flex;
            gap: 10px;
        }
        
        .bottom-button {
            padding: 8px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            background-color: white;
            cursor: pointer;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal {
            background-color: white;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .modal-header {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 20px;
        }
        
        .modal-content {
            margin-bottom: 20px;
            display: flex;
        }
        
        .form-column {
            flex: 2;
        }
        
        .image-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 20px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .input-field input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .image-placeholder {
            width: 100px;
            height: 100px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            cursor: pointer;
        }
        
        .image-placeholder i {
            font-size: 30px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .image-placeholder .plus-icon {
            position: relative;
            top: -5px;
            right: -15px;
            font-size: 16px;
            background-color: #666;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .btn-primary {
            background-color: #242a61;
            color: white;
            border: none;
        }
        
        .btn-secondary {
            background-color: white;
            color: #333;
            border: 1px solid #ddd;
        }
        
        /* Hamburger menu button */
        .menu-button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <div class="navigation">
                <button class="menu-button">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="nav-item">Registrar</div>
                <div class="nav-item">Órdenes</div>
            </div>
            
            <div class="logo">
                <img src="/api/placeholder/30/30" alt="Logo">
                <span>InnovaCraft</span>
            </div>
            
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar producto">
            </div>
        </div>
        
        <div class="content-area">
            <div class="cart-area">
                <div class="empty-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <p>Agregue productos...</p>
                </div>
                
                <div class="add-button" id="openNewProductBtn">
                    <i class="fas fa-plus"></i>
                </div>
                
                <div class="bottom-buttons">
                    <button class="bottom-button">Cliente</button>
                    <button class="bottom-button">Nota</button>
                </div>
            </div>
        </div>
        
        <!-- Modal de nuevo producto -->
        <div class="modal-overlay" id="newProductModal">
            <div class="modal">
                <div class="modal-header">Nuevo producto</div>
                <div class="modal-content">
                    <div class="form-column">
                        <div class="input-group">
                            <label>Nombre del producto:</label>
                            <div class="input-field">
                                <input type="text" placeholder="Por ejemplo, tacos.">
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label>Código de barras:</label>
                            <div class="input-field">
                                <input type="text" placeholder="Por ejemplo, 123456789.">
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label>Precio de venta:</label>
                            <div class="input-field">
                                <input type="text" placeholder="Por ejemplo, $100.">
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label>Impuesto de venta:</label>
                            <div class="input-field">
                                <input type="text" placeholder="Por ejemplo, 16%.">
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label>Cantidad disponible:</label>
                            <div class="input-field">
                                <input type="text" placeholder="Por ejemplo, 100.">
                            </div>
                        </div>
                    </div>
                    
                    <div class="image-column">
                        <div>Añadir foto</div>
                        <div class="image-placeholder">
                            <i class="fas fa-camera"></i>
                            <span class="plus-icon">+</span>
                        </div>
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button class="btn btn-primary" id="saveProductBtn">Guardar</button>
                    <button class="btn btn-secondary" id="cancelProductBtn">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome para íconos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
    
    <script>
        // Mostrar modal al hacer clic en el botón +
        document.getElementById('openNewProductBtn').addEventListener('click', function() {
            document.getElementById('newProductModal').style.display = 'flex';
        });
        
        // Cerrar modal al guardar
        document.getElementById('saveProductBtn').addEventListener('click', function() {
            document.getElementById('newProductModal').style.display = 'none';
            alert('Producto guardado con éxito');
        });
        
        // Cerrar modal al cancelar
        document.getElementById('cancelProductBtn').addEventListener('click', function() {
            document.getElementById('newProductModal').style.display = 'none';
        });
    </script>
</body>
</html>
