<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <!-- Importando las fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Work+Sans&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #30343F;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Work Sans', sans-serif;
        }
        
        .login-container {
            background-color: white;
            border-radius: 1rem;
            padding: 2rem;
            width: 100%;
            max-width: 600px; /* Aumentado el ancho del contenedor */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
        }
        
        .logo-container {
            flex: 0 0 180px; /* Aumentado el espacio para el logo */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 2rem;
        }
        
        .logo {
            width: 200px; /* Aumentado el tamaño del logo */
            height: 200px; /* Aumentado el tamaño del logo */
            border-radius: 0%;
            object-fit: contain;
        }
        
        .form-container {
            flex: 1;
        }
        
        h1 {
            font-family: 'Raleway', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: normal;
        }
        
        .input-container {
            position: relative;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 0.25rem;
            font-size: 1rem;
            font-family: 'Work Sans', sans-serif;
        }
        
        /* Añadiendo padding-left para todos los inputs con íconos */
        input[type="email"], 
        input[type="password"] {
            padding-left: 2.5rem;
        }
        
        .icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .icon-left {
            left: 0.5rem;
        }
        
        .icon-right {
            right: 0.5rem;
            cursor: pointer;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 1.5rem;
        }
        
        .forgot-password a {
            color: #1f2937;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .btn-login {
            display: block;
            width: 100%;
            padding: 0.75rem;
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 2rem; /* Bordes más redondeados para el botón */
            font-size: 1rem;
            font-family: 'Work Sans', sans-serif;
            cursor: pointer;
            margin-bottom: 1.5rem;
            transition: background-color 0.2s;
        }
        
        .btn-login:hover {
            background-color: #1e40af;
        }
        
        .register {
            text-align: center;
            font-size: 0.9rem;
        }
        
        .register a {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <img src="photos/Pepsi-Logo.jpg" alt="Logo de Pepsi" class="logo">
        </div>
        
        <div class="form-container">
            <h1>Iniciar sesión</h1>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <div class="input-container">
                        <span class="icon icon-left">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#777" viewBox="0 0 16 16">
                                <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2zm13 2.383-4.708 2.825L15 11.105V5.383zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741zM1 11.105l4.708-2.897L1 5.383v5.722z"/>
                            </svg>
                        </span>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-container">
                        <span class="icon icon-left">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#777" viewBox="0 0 16 16">
                                <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" required>
                        <span class="icon icon-right" id="togglePassword">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#777" viewBox="0 0 16 16">
                                <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/>
                                <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>
                            </svg>
                        </span>
                    </div>
                </div>
                
                <div class="forgot-password">
                    <a href="passwordRecovery.html">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn-login">Iniciar sesión</button>
                
                <div class="register">
                    <p>¿No tienes una cuenta? <a href="createAccount.html">Regístrate aquí</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            
            togglePassword.addEventListener('click', function() {
                // Toggle type attribute
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                
                // Simplemente cambiamos el color del icono para indicar el estado
                // Usamos un solo icono (ojo) pero con diferente opacidad
                if (type === 'password') {
                    togglePassword.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#777" viewBox="0 0 16 16">
                            <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/>
                            <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>
                        </svg>
                    `;
                } else {
                    togglePassword.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#777" viewBox="0 0 16 16" style="opacity: 0.7;">
                            <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z"/>
                            <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/>
                        </svg>
                    `;
                }
            });
            
            const loginForm = document.getElementById('loginForm');
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Aquí puedes agregar la lógica para enviar los datos del formulario a tu servidor
                console.log('Correo electrónico:', email);
                console.log('Contraseña:', password);
                
                // Simulación de envío exitoso
                alert('Inicio de sesión exitoso!');
                window.location.href = 'home.html';
            });
        });
    </script>
</body>
</html>
